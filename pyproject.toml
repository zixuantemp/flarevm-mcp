[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flarevm-mcp"
version = "1.1.0"
description = "MCP server for FlareVM malware analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "zixuantemp"}]
keywords = ["mcp", "malware-analysis", "flarevm", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0",
    "pywinrm>=0.4.3",
    "keyring>=24.0.0",
    "requests>=2.31.0",
]

[project.scripts]
flarevm-mcp = "server:main_sync"

[project.urls]
Homepage = "https://github.com/zixuantemp/flarevm-mcp"
Repository = "https://github.com/zixuantemp/flarevm-mcp"
Issues = "https://github.com/zixuantemp/flarevm-mcp/issues"

[tool.setuptools]
py-modules = ["server"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
# Ignore line-too-long: server.py has many embedded PowerShell heredocs that
# cannot be wrapped without breaking the script. Real bugs (F-rules) still flag.
ignore = ["E501"]

