name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Import + registry
        run: |
          python - <<'PY'
          import os; os.environ.pop("FLAREVM_HOST", None)
          import flarevm_mcp.server as s
          from flarevm_mcp.registry import REGISTRY
          assert len(REGISTRY) >= 55, len(REGISTRY)
          for method in ("tools/list", "tools/call", "prompts/list", "prompts/get", "resources/list", "resources/read"):
              assert s.app.get_request_handler(method) is not None, method
          print("OK", len(REGISTRY), "tools")
          PY
      - name: Configuration contract
        run: |
          python - <<'PY'
          import os, re, subprocess, sys, tempfile
          os.environ.pop("FLAREVM_HOST", None)
          from flarevm_mcp import config
          assert config.FLAREVM_HOST is None
          r = subprocess.run([sys.executable, "-c", "from flarevm_mcp import config; config.require_host()"],
                             capture_output=True, text=True, env={k: v for k, v in os.environ.items() if k != "FLAREVM_HOST"})
          assert r.returncode != 0 and "FLAREVM_HOST" in (r.stdout + r.stderr), r
          r = subprocess.run([sys.executable, "-c", "from flarevm_mcp import config; config.get_password()"],
                             capture_output=True, text=True, env={k: v for k, v in os.environ.items() if k != "FLAREVM_PASSWORD"})
          assert r.returncode != 0 and "password" in (r.stdout + r.stderr).lower(), "must refuse without a password"
          with tempfile.NamedTemporaryFile("w", suffix=".env", delete=False) as f:
              f.write("FLAREVM_HOST=10.0.0.9\nFLAREVM_SMB_SHARE=Alt\n# c\n"); path = f.name
          os.environ["FLAREVM_SMB_SHARE"] = "FromEnv"
          config._load_dotenv(path)
          assert os.environ["FLAREVM_HOST"] == "10.0.0.9" and os.environ["FLAREVM_SMB_SHARE"] == "FromEnv"
          import glob
          for fn in glob.glob("flarevm_mcp/**/*.py", recursive=True):
              hits = re.findall(r"\b(?:192\.168|10\.\d+|172\.(?:1[6-9]|2\d|3[01]))\.\d+\.\d+\b", open(fn).read())
              assert not hits, (fn, hits)
          print("configuration contract OK")
          PY
      - run: pytest -q
      - name: docs/TOOLS.md in sync with the registry
        run: python -m flarevm_mcp.docs --check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff bandit
      - run: ruff check flarevm_mcp server.py tests
      # B404/B603/B607: subprocess use is inherent to a remote-execution bridge.
      - run: bandit -r flarevm_mcp server.py -ll --skip B404,B603,B607
